service: hub-api
frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-central-1
  environment:
    # Cognito
    COGNITO_USER_POOL_ID: eu-central-1_2aEk8Onki
    COGNITO_APP_CLIENT_ID: heajnhd40jrihjlv70k3m6o8u

    # JWT e app config
    JWT_SECRET: ${env:JWT_SECRET}
    PRODUCTS_TABLE: ${env:PRODUCTS_TABLE}
    ORDERS_TABLE: ${env:ORDERS_TABLE}
    PARTNERS_REQUESTS_TABLE: ${env:PARTNERS_REQUESTS_TABLE}
    FRONTEND_URLS: ${env:FRONTEND_URLS}

    # Stripe
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}

  iamRoleStatements:
    # Auth tables
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:eu-central-1:941377144465:table/hub_sessions
        - arn:aws:dynamodb:eu-central-1:941377144465:table/hub_codes
        - arn:aws:dynamodb:eu-central-1:941377144465:table/hub_users

    # Products
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:eu-central-1:941377144465:table/Products

    # Orders
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:eu-central-1:941377144465:table/orders
        - arn:aws:dynamodb:eu-central-1:941377144465:table/orders/index/userId-index

    # Partners Requests
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:eu-central-1:941377144465:table/partners_requests

    # Allow requestCoupon to invoke createCoupon Lambda
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:eu-central-1:941377144465:function:hub-api-dev-createCoupon

  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - https://dev.d3idv4br2ibj8m.amplifyapp.com
        - https://dev.d1xuz6wpo1v9ag.amplifyapp.com
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true

plugins:
  - serverless-esbuild

functions:
  # AUTH
  createSession:
    handler: src/handlers/auth/session.handler
    events:
      - httpApi:
          path: /auth/session
          method: post

  exchange:
    handler: src/handlers/auth/exchange.handler
    events:
      - httpApi:
          path: /auth/exchange
          method: post

  profile:
    handler: src/handlers/auth/profile.handler
    events:
      - httpApi:
          path: /auth/profile
          method: get

  me:
    handler: src/handlers/auth/me.handler
    events:
      - httpApi:
          path: /auth/me
          method: get

  logout:
    handler: src/handlers/auth/logout.handler
    events:
      - httpApi:
          path: /auth/logout
          method: post

  postConfirmation:
    handler: src/handlers/auth/postConfirmation.handler
    events:
      - cognitoUserPool:
          pool: ${env:COGNITO_USER_POOL_ID}
          trigger: PostConfirmation
          existing: true

  # PRODUCTS
  addProduct:
    handler: src/handlers/products/add.handler
    events:
      - httpApi:
          path: /products
          method: post

  getProducts:
    handler: src/handlers/products/get.handler
    events:
      - httpApi:
          path: /products
          method: get

  getProductById:
    handler: src/handlers/products/getById.handler
    events:
      - httpApi:
          path: /products/{id}
          method: get

  updateProduct:
    handler: src/handlers/products/update.handler
    events:
      - httpApi:
          path: /products/{id}
          method: put

  deleteProduct:
    handler: src/handlers/products/delete.handler
    events:
      - httpApi:
          path: /products/{id}
          method: delete

  # PAYMENTS
  createCheckoutSession:
    handler: src/handlers/payments/createCheckoutSession.handler
    events:
      - httpApi:
          path: /payments/create-checkout-session
          method: post

  webhookStripe:
    handler: src/handlers/payments/webhook-stripe.handler
    events:
      - httpApi:
          path: /payments/webhook
          method: post

  # ORDERS
  getUserOrders:
    handler: src/handlers/orders/getUserOrders.handler
    events:
      - httpApi:
          path: /orders
          method: get

  # PARTNERS
  savePartnerRequest:
    handler: src/handlers/partners/saveRequest.handler
    events:
      - httpApi:
          path: /partners/requests
          method: post

  deletePartnerRequest:
    handler: src/handlers/partners/deleteRequest.handler
    events:
      - httpApi:
          path: /partners/requests/{id}
          method: delete

  markPartnerRequestHandled:
    handler: src/handlers/partners/markRequestHandled.handler
    events:
      - httpApi:
          path: /partners/requests/{id}/handled
          method: put

  listPartnerRequests:
    handler: src/handlers/partners/listRequests.handler
    events:
      - httpApi:
          path: /partners/requests
          method: get

  # COUPONS
  requestCoupon:
    handler: src/handlers/coupons/requestCoupon.handler
    events:
      - httpApi:
          path: /coupons/request
          method: post

  createCoupon:
    handler: src/handlers/coupons/createCoupon.handler
    events:
      - httpApi:
          path: /coupons/create
          method: post
