service: hub-api
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-central-1
  environment:
    COGNITO_USER_POOL_ID: eu-central-1_2aEk8Onki
    COGNITO_APP_CLIENT_ID: heajnhd40jrihjlv70k3m6o8u
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:eu-central-1:941377144465:table/hub_sessions
        - arn:aws:dynamodb:eu-central-1:941377144465:table/hub_codes
        - arn:aws:dynamodb:eu-central-1:941377144465:table/hub_users

  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - https://dev.d3idv4br2ibj8m.amplifyapp.com
        - https://dev.d1xuz6wpo1v9ag.amplifyapp.com
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowCredentials: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

custom:
  dotenv:
    exclude:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION

functions:
  createSession:
    handler: src/handlers/auth/session.handler
    events:
      - httpApi:
          path: /auth/session
          method: post

  profile:
    handler: src/handlers/auth/profile.handler
    events:
      - httpApi:
          path: /auth/profile
          method: get

  me:
    handler: src/handlers/auth/me.handler
    events:
      - httpApi:
          path: /auth/me
          method: get

  logout:
    handler: src/handlers/auth/logout.handler
    events:
      - httpApi:
          path: /auth/logout
          method: post

  postConfirmation:
    handler: src/handlers/auth/postConfirmation.handler
    events:
      - cognitoUserPool:
          pool: eu-central-1_2aEk8Onki
          trigger: PostConfirmation
          existing: true

resources:
  Resources: {}
